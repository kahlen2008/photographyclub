<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYP Photography Club | Login</title>
  <meta name="description" content="Log in to your NYP Photography Club member account.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script>
    if(localStorage.getItem('isLoggedIn') === 'true') document.documentElement.classList.add('logged-in');
    if(localStorage.getItem('isAdmin') === 'true') document.documentElement.classList.add('is-admin');
  </script>
</head>
<body>

  <!-- Split Login Layout (no sidebar) -->
  <div class="login-split">

    <!-- Left: Image Side -->
    <div class="login-image-side">
      <div class="bg-img"></div>
      <div class="image-text">
        <h2>Capture moments.<br>Create memories.</h2>
        <p>Join a community of passionate photographers who see the world a little differently.</p>
      </div>
    </div>

    <!-- Right: Form Side -->
    <div class="login-form-side">

      <a href="index.html" class="login-brand">
        <div class="logo-icon"><i class="bi bi-camera"></i></div>
        <span>NYP Photography Club</span>
      </a>
      <div class="login-form-wrapper">
        <h1>Welcome back</h1>
        <p class="login-subtitle">Sign in to access the members portal.</p>

        <div id="loginError" class="alert-error d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" required placeholder="you@example.com">
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required placeholder="Enter your password">
            <div class="invalid-feedback">Please enter your password.</div>
          </div>

          <button type="submit" class="btn-primary-dark">Sign In</button>

          <div class="login-divider">or</div>

          <button type="button" id="googleLoginBtn" class="btn-google">
            <i class="bi bi-google"></i> Continue with Google
          </button>
        </form>

        <p class="login-footer-text">
          Not a member yet? <a href="join.html">Apply to join</a>
        </p>

      </div>
    </div>

  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
